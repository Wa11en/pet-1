name: Publish signed offline APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version (for example 0.6.0)
        required: true
        default: '0.6.0'
        type: string

permissions:
  contents: write

concurrency:
  group: publish-offline-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  android-app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore the exact signed APK and regression baseline
        run: |
          python3 scripts/restore_offline_apk.py "downloads/offline-v$RELEASE_VERSION" "$RUNNER_TEMP/search-current" --version "$RELEASE_VERSION"
          echo "SEARCH_CURRENT_APK=$RUNNER_TEMP/search-current/Private-Diary-$RELEASE_VERSION-offline.apk" >> "$GITHUB_ENV"
          echo "SEARCH_TEST_APK=$GITHUB_WORKSPACE/downloads/offline-v$RELEASE_VERSION/android-test/search-input-tests.apk" >> "$GITHUB_ENV"
          if [[ "$RELEASE_VERSION" == "0.5.1" ]]; then
            python3 scripts/restore_offline_apk.py downloads/offline-v0.5.0 "$RUNNER_TEMP/search-baseline" --version 0.5.0
            echo "SEARCH_BASELINE_APK=$RUNNER_TEMP/search-baseline/Private-Diary-0.5.0-offline.apk" >> "$GITHUB_ENV"
          fi
      - name: Verify the signed instrumentation APK
        working-directory: downloads/offline-v${{ inputs.version }}
        run: sha256sum --check SHA256SUMS-android-test.txt
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check search, encryption, upgrades, drafts, trash and favorites on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 2048
          script: bash scripts/check_android_search.sh "$SEARCH_CURRENT_APK" "$SEARCH_TEST_APK" "${SEARCH_BASELINE_APK:-}"

  publish:
    needs: android-app-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must contain three numeric components, for example 0.6.0" >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore and verify the locally signed APK
        run: >-
          python3 scripts/restore_offline_apk.py
          "downloads/offline-v$RELEASE_VERSION" "$RUNNER_TEMP/offline-release"
          --version "$RELEASE_VERSION"
      - name: Upload verified APK to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$RELEASE_VERSION" \
            "$RUNNER_TEMP/offline-release/Private-Diary-$RELEASE_VERSION-offline.apk" \
            "downloads/offline-v$RELEASE_VERSION/SHA256SUMS-apk.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
