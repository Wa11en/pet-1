name: Publish signed offline APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version (for example 0.5.0)
        required: true
        default: '0.5.0'
        type: string

permissions:
  contents: write

concurrency:
  group: publish-offline-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must contain three numeric components, for example 0.5.0" >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore and verify the locally signed APK
        run: >-
          python3 scripts/restore_offline_apk.py
          "downloads/offline-v$RELEASE_VERSION" "$RUNNER_TEMP/offline-release"
          --version "$RELEASE_VERSION"
      - name: Upload verified APK to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$RELEASE_VERSION" \
            "$RUNNER_TEMP/offline-release/Private-Diary-$RELEASE_VERSION-offline.apk" \
            "downloads/offline-v$RELEASE_VERSION/SHA256SUMS-apk.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
